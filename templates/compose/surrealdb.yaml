# documentation: https://surrealdb.com/docs
# slogan: A scalable, distributed, collaborative document database for modern applications.
# category: database
# tags: database,document,graph,realtime,websocket,distributed,embedded,api
# logo: svgs/surrealdb.svg
# port: 8000

services:
  surrealdb:
    image: 'surrealdb/surrealdb:latest'
    user: root
    command: start --log info --user ${SERVICE_USER_ROOT} --pass ${SERVICE_PASSWORD_ROOT} surrealkv://var/data/surreal.db
    environment:
      - SERVICE_URL_SURREALDB_8000
    volumes:
      - 'surrealdb-data:/var/data'
    healthcheck:
      test: ['CMD', '/surreal', 'isready']
      interval: 5s
      timeout: 10s
      retries: 10
      start_period: 10s
