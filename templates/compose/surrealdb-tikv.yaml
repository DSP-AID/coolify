# documentation: https://surrealdb.com/docs
# slogan: SurrealDB with a distributed TiKV storage backend, including PD and TiKV nodes.
# category: database
# tags: database,document,graph,realtime,websocket,distributed,tikv,api
# logo: svgs/surrealdb.svg
# port: 8000

services:
  surrealdb:
    image: 'surrealdb/surrealdb:v3' # v4 dropped built-in TiKV support; the surreal-tikv binary has no published image yet, so this variant stays on v3
    user: root
    command: start --log info --user ${SERVICE_USER_ROOT} --pass ${SERVICE_PASSWORD_ROOT} tikv://tikv-pd:2379
    environment:
      - SERVICE_URL_SURREALDB_8000
    depends_on:
      tikv-pd:
        condition: service_healthy
      tikv:
        condition: service_healthy
    healthcheck:
      test: ['CMD', '/surreal', 'isready']
      interval: 5s
      timeout: 10s
      retries: 10
      start_period: 30s
  tikv-pd:
    image: 'pingcap/pd:v7.5.8' # TiKV 7 LTS; SurrealDB's built-in TiKV client is unmaintained upstream, treat this variant as experimental
    command:
      - --name=tikv-pd
      - --data-dir=/var/lib/pd/data
      - --client-urls=http://0.0.0.0:2379
      - --advertise-client-urls=http://tikv-pd:2379
      - --peer-urls=http://0.0.0.0:2380
      - --advertise-peer-urls=http://tikv-pd:2380
      - --initial-cluster=tikv-pd=http://tikv-pd:2380
    volumes:
      - 'pd-data:/var/lib/pd/data'
    healthcheck:
      test: ['CMD-SHELL', 'curl --silent --fail http://localhost:2379/pd/api/v1/health']
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 10s
  tikv:
    image: 'pingcap/tikv:v7.5.8'
    command:
      - --pd-endpoints=http://tikv-pd:2379
      - --addr=0.0.0.0:20160
      - --advertise-addr=tikv:20160
      - --status-addr=0.0.0.0:20180
      - --data-dir=/var/lib/tikv/data
      - --labels=host=tikv
    volumes:
      - 'tikv-data:/var/lib/tikv/data'
    depends_on:
      tikv-pd:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'wget -q --spider http://localhost:20180/status']
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 10s
